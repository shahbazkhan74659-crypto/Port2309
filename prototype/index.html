<title>Renzo Malik</title>
<meta name="description" content="Personal portfolio of Renzo Malik — student, developer, and writer exploring AI and digital products.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #0b0910;
    --bg-raised: #131019;
    --bg-raised-2: #17131e;
    --ink: #f3ede1;
    --ink-dim: #948da3;
    --ink-faint: #5c5668;
    --border: rgba(243,237,225,0.11);
    --border-strong: rgba(243,237,225,0.2);
    --accent: #a58ff5;
    --accent-soft: rgba(165,143,245,0.14);
    --accent-dim: #6b5aa8;

    --font-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    --font-body: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;

    --edge: clamp(20px, 5vw, 64px);
    --max: 1400px;
  }

  *, *::before, *::after{ box-sizing: border-box; }
  html{ background: var(--bg); }
  html, body{ margin:0; padding:0; overflow-x: hidden; }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    width: 100%;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
  }

  a{ color: inherit; text-decoration: none; }
  button{ font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  ul{ list-style: none; margin: 0; padding: 0; }
  img{ max-width: 100%; display: block; }
  h1,h2,h3,p{ margin: 0; }

  ::selection{ background: var(--accent); color: #0b0910; }

  :focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .wrap{ max-width: var(--max); margin: 0 auto; padding-left: var(--edge); padding-right: var(--edge); }

  /* ---------- NAV ---------- */
  .nav{
    position: sticky; top: 0; z-index: 40;
    background: rgba(11,9,16,0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner{
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px var(--edge);
    max-width: var(--max); margin: 0 auto;
    gap: 16px;
  }
  .nav-name{
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(0.85rem, 1.4vw, 1rem);
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .nav-links{ display: flex; align-items: center; gap: clamp(16px, 3vw, 34px); }
  .nav-link{
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    position: relative;
    padding: 4px 2px;
    transition: color 0.2s ease;
  }
  .nav-link:hover{ color: var(--ink); }
  .nav-link[aria-current="page"]{ color: var(--ink); }
  .nav-link[aria-current="page"]::after{
    content: ""; position: absolute; left: 0; right: 0; bottom: -6px;
    height: 1px; background: var(--accent);
  }
  .nav-mark{
    font-family: var(--font-display); font-weight: 800; color: var(--accent);
    font-size: 0.95rem;
  }

  /* ---------- SECTION RHYTHM ---------- */
  .section{ padding-top: clamp(64px, 10vw, 120px); padding-bottom: clamp(64px, 10vw, 120px); }
  .section + .section{ border-top: 1px solid var(--border); }
  .eyebrow{
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .eyebrow .accent-dot{ color: var(--accent); }

  /* ---------- HERO ---------- */
  .hero{ padding-top: clamp(40px, 7vw, 76px); padding-bottom: clamp(50px, 8vw, 90px); position: relative; }
  .hero-greeting{ margin-bottom: clamp(18px, 3vw, 28px); }
  .hero-type{ position: relative; }
  .hero-line{
    font-family: var(--font-display);
    font-weight: 900;
    line-height: 0.94;
    letter-spacing: -0.02em;
    font-size: clamp(2.6rem, 8.6vw, 7.4rem);
    text-wrap: balance;
  }
  .hero-line.dim{ color: var(--ink-faint); font-weight: 800; }
  .hero-name-row{
    display: flex; align-items: baseline; gap: clamp(10px, 2vw, 20px); flex-wrap: wrap;
  }
  .hero-portrait-slot{
    float: right;
    shape-outside: inset(0);
    width: clamp(150px, 22vw, 300px);
    height: clamp(190px, 28vw, 380px);
    margin: 0.1em clamp(6px, 2vw, 18px) 0.05em clamp(14px, 3vw, 28px);
    position: relative;
  }
  .hero-portrait{
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 12%;
    -webkit-mask-image: linear-gradient(to bottom, black 74%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 74%, transparent 100%);
    filter: saturate(1.05) contrast(1.03);
  }
  .hero-portrait-glow{
    position: absolute; inset: -20% -30%;
    background: radial-gradient(closest-side, var(--accent-soft), transparent 70%);
    z-index: -1;
    pointer-events: none;
  }
  .hero-meta{
    margin-top: clamp(28px, 5vw, 48px);
    display: flex; flex-wrap: wrap; gap: clamp(28px, 6vw, 72px);
    clear: both;
  }
  .hero-meta-block{ font-family: var(--font-mono); font-size: 0.78rem; line-height: 1.9; color: var(--ink-dim); letter-spacing: 0.02em; }
  .hero-meta-block strong{ color: var(--ink); font-weight: 500; }
  .hero-meta-block.roles{ color: var(--ink); font-weight: 500; letter-spacing: 0.08em; }

  /* ---------- FEATURED PROJECT (home artifact-on-page style) ---------- */
  .feat-head{ display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: clamp(20px, 4vw, 36px); flex-wrap: wrap; }
  .feat-title{
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(2.4rem, 6.4vw, 5.2rem);
    line-height: 0.96; letter-spacing: -0.02em; text-wrap: balance;
  }
  .feat-body{ display: grid; grid-template-columns: 1.05fr 1fr; gap: clamp(28px, 5vw, 64px); align-items: center; }
  .feat-desc{ max-width: 46ch; color: var(--ink-dim); font-size: clamp(0.95rem, 1.2vw, 1.05rem); line-height: 1.65; margin-top: 14px; }
  .feat-footline{ display: flex; align-items: center; justify-content: space-between; margin-top: clamp(20px, 3vw, 30px); }
  .count{ font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-faint); letter-spacing: 0.04em; }
  .explore-link{
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink); border-bottom: 1px solid var(--border-strong); padding-bottom: 4px;
    transition: border-color 0.2s ease, color 0.2s ease, gap 0.2s ease;
  }
  .explore-link:hover{ color: var(--accent); border-color: var(--accent); gap: 12px; }
  .explore-link .arrow{ transition: transform 0.2s ease; }
  .explore-link:hover .arrow{ transform: translateX(2px); }

  /* Browser-chrome project mockup */
  .mockup{
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: var(--bg-raised);
    overflow: hidden;
    box-shadow: 0 30px 70px -30px rgba(0,0,0,0.7);
    transition: transform 0.35s cubic-bezier(.2,.7,.3,1);
  }
  a.mockup-link{ display: block; }
  a.mockup-link:hover .mockup, a.mockup-link:focus-visible .mockup{ transform: translateY(-4px); }
  .mockup-bar{ display:flex; align-items:center; gap:10px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--bg-raised-2); }
  .mockup-dots{ display:flex; gap:6px; }
  .mockup-dots span{ width:8px; height:8px; border-radius:50%; background: var(--ink-faint); opacity:0.6; }
  .mockup-url{ font-family: var(--font-mono); font-size: 0.68rem; color: var(--ink-faint); background: var(--bg); border-radius: 5px; padding: 3px 10px; }
  .mockup-body{ padding: 18px; min-height: 200px; display:flex; flex-direction:column; gap:12px; }

  .mk-row{ display:flex; gap:10px; }
  .mk-block{ background: var(--bg-raised-2); border: 1px solid var(--border); border-radius: 6px; }
  .mk-line{ height: 8px; border-radius: 4px; background: var(--border-strong); }
  .mk-chip{ font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.06em; color: var(--accent); background: var(--accent-soft); border-radius: 20px; padding: 3px 9px; display:inline-block; }

  /* ---------- STATEMENT ---------- */
  .statement{ text-align: center; }
  .statement p{
    font-family: var(--font-display); font-weight: 600;
    font-size: clamp(1.5rem, 4vw, 3rem);
    line-height: 1.24; letter-spacing: -0.01em;
    max-width: 20ch; margin: 0 auto; text-wrap: balance;
    color: var(--ink);
  }
  .statement p .u{ text-decoration: underline; text-decoration-color: var(--accent-dim); text-underline-offset: 6px; }

  /* ---------- ABOUT SNAPSHOT ---------- */
  .about-grid{ display: grid; grid-template-columns: 1.3fr 1fr; gap: clamp(28px, 5vw, 60px); align-items: start; margin-top: clamp(18px, 3vw, 30px); }
  .about-headline{
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(2.2rem, 6vw, 4.6rem); line-height: 0.98; letter-spacing: -0.02em;
  }
  .about-para{ color: var(--ink-dim); font-size: 1rem; line-height: 1.75; max-width: 46ch; }
  .currently{ margin-top: clamp(20px, 3vw, 30px); display: grid; gap: 8px; font-family: var(--font-mono); font-size: 0.82rem; color: var(--ink-dim); }
  .currently strong{ color: var(--ink); font-weight: 500; }
  .currently-label{ color: var(--ink-faint); font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 4px; }
  .more-link{ margin-top: 22px; display:inline-flex; }

  /* ---------- CTA / CONTACT-END ---------- */
  .cta-title{
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(3rem, 11vw, 8rem);
    line-height: 0.92; letter-spacing: -0.02em;
  }
  .cta-row{ display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 24px; margin-top: clamp(28px, 5vw, 44px); }
  .cta-links{ font-family: var(--font-mono); font-size: 0.85rem; color: var(--ink-dim); line-height: 2; }
  .cta-links a{ color: var(--ink); border-bottom: 1px solid transparent; transition: color 0.2s ease, border-color 0.2s ease; }
  .cta-links a:hover{ color: var(--accent); border-color: var(--accent); }
  .cta-social{ display:flex; gap: 18px; margin-top: 6px; }

  .btn-ghost{
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase;
    border: 1px solid var(--border-strong); border-radius: 999px; padding: 14px 22px;
    transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
  }
  .btn-ghost:hover{ border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  /* ---------- FOOTER ---------- */
  .foot{ border-top: 1px solid var(--border); padding: 26px var(--edge); }
  .foot-inner{ max-width: var(--max); margin:0 auto; display:flex; justify-content: space-between; align-items:center; flex-wrap: wrap; gap: 14px; }
  .foot-mark{ font-family: var(--font-display); font-weight: 800; color: var(--accent); }
  .foot-links{ display:flex; gap: clamp(14px, 3vw, 26px); flex-wrap: wrap; }
  .foot-links a{ font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); transition: color 0.2s ease; }
  .foot-links a:hover{ color: var(--ink); }
  .foot-copy{ font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); }

  /* ---------- PROJECTS PAGE ---------- */
  .page-head{ padding-top: clamp(50px, 8vw, 84px); }
  .page-title{
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(2.6rem, 8vw, 6rem); line-height: 0.95; letter-spacing: -0.02em;
  }
  .page-sub{ color: var(--ink-dim); max-width: 52ch; margin-top: 16px; font-size: 1rem; line-height: 1.6; }

  .proj-entry{ padding: clamp(48px, 8vw, 88px) 0; }
  .proj-entry + .proj-entry{ border-top: 1px solid var(--border); }
  .proj-top{ display:flex; justify-content: space-between; align-items:flex-start; gap: 20px; margin-bottom: 20px; }
  .proj-num{ font-family: var(--font-mono); color: var(--ink-faint); font-size: 0.85rem; }
  .proj-status{ font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 5px 10px; border-radius: 20px; white-space: nowrap; }
  .proj-name{
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(2.1rem, 5.6vw, 4.2rem); line-height: 1; letter-spacing: -0.02em; margin-bottom: 18px;
    text-wrap: balance;
  }
  .proj-layout{ display: grid; grid-template-columns: 1fr 1.15fr; gap: clamp(28px, 5vw, 56px); align-items: center; }
  .proj-desc{ color: var(--ink-dim); font-size: 1.02rem; line-height: 1.7; max-width: 48ch; }
  .proj-tags{ display:flex; flex-wrap:wrap; gap: 8px; margin-top: 18px; }
  .proj-tag{ font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-dim); border: 1px solid var(--border); padding: 5px 11px; border-radius: 20px; }
  .proj-meta-row{ display:flex; gap: 28px; margin-top: 18px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-faint); }
  .proj-meta-row strong{ color: var(--ink-dim); display:block; font-size: 0.62rem; letter-spacing:0.12em; text-transform: uppercase; margin-bottom: 4px; font-weight: 500;}
  .proj-actions{ display:flex; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
  .btn-line{ display:inline-flex; align-items:center; gap:8px; font-family: var(--font-mono); font-size: 0.76rem; letter-spacing:0.08em; text-transform:uppercase; color: var(--ink); border-bottom: 1px solid var(--border-strong); padding-bottom: 4px; transition: color 0.2s ease, border-color 0.2s ease; }
  .btn-line:hover{ color: var(--accent); border-color: var(--accent); }

  /* ---------- PROJECT DETAIL ---------- */
  .detail-back{ font-family: var(--font-mono); font-size: 0.76rem; color: var(--ink-dim); letter-spacing: 0.08em; text-transform: uppercase; }
  .detail-back:hover{ color: var(--accent); }
  .detail-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: clamp(30px,5vw,64px); align-items:start; margin-top: clamp(30px,5vw,50px); }
  .detail-info dl{ display:grid; grid-template-columns: auto 1fr; gap: 10px 24px; font-family: var(--font-mono); font-size: 0.85rem; margin-top: 30px; }
  .detail-info dt{ color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.68rem; padding-top: 3px; }
  .detail-info dd{ margin:0; color: var(--ink); }

  /* ---------- ABOUT PAGE ---------- */
  .about-lede{ font-family: var(--font-display); font-weight: 700; font-size: clamp(1.6rem, 3.6vw, 2.6rem); line-height: 1.28; max-width: 22ch; letter-spacing: -0.01em; text-wrap: balance; }
  .prose{ max-width: 62ch; color: var(--ink-dim); font-size: 1.02rem; line-height: 1.8; }
  .prose + .prose{ margin-top: 18px; }
  .two-col{ display:grid; grid-template-columns: 1fr 1fr; gap: clamp(28px,5vw,60px); }
  .stack-title{ font-family: var(--font-display); font-weight: 800; font-size: clamp(1.3rem, 2.6vw, 1.8rem); margin-bottom: 14px; }
  .skill-groups{ display:grid; gap: 26px; }
  .skill-group-label{ font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 10px; }
  .skill-tags{ display:flex; flex-wrap:wrap; gap: 8px; }
  .skill-tag{ font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink); border: 1px solid var(--border); padding: 7px 13px; border-radius: 20px; }
  .quote-block{
    font-family: var(--font-display); font-weight: 600; font-size: clamp(1.3rem, 3vw, 2.1rem);
    line-height: 1.35; max-width: 30ch; border-left: 2px solid var(--accent); padding-left: clamp(18px,3vw,28px);
    text-wrap: balance;
  }

  /* ---------- CONTACT PAGE ---------- */
  .contact-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: clamp(30px,5vw,70px); align-items:start; }
  .contact-list{ margin-top: clamp(24px,4vw,40px); display:grid; gap: 18px; }
  .contact-row{ display:flex; justify-content: space-between; align-items:center; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .contact-row-label{ font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); letter-spacing: 0.12em; text-transform: uppercase; }
  .contact-row-value{ font-family: var(--font-mono); font-size: 0.95rem; color: var(--ink); transition: color 0.2s ease; }
  .contact-row a:hover .contact-row-value{ color: var(--accent); }

  .field{ margin-bottom: 22px; }
  .field label{ display:block; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 10px; }
  .field input, .field textarea{
    width: 100%; background: var(--bg-raised); border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 14px 16px; color: var(--ink); font-family: var(--font-body); font-size: 0.98rem;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .field textarea{ resize: vertical; min-height: 120px; }
  .field input:focus, .field textarea:focus{ outline: none; border-color: var(--accent); background: var(--bg-raised-2); }
  .field input[aria-invalid="true"], .field textarea[aria-invalid="true"]{ border-color: #d97a7a; }
  .field-error{ font-family: var(--font-mono); font-size: 0.72rem; color: #e79c9c; margin-top: 7px; min-height: 1em; }
  .submit-btn{
    display:inline-flex; align-items:center; gap:10px;
    background: var(--ink); color: var(--bg); font-family: var(--font-mono); font-size: 0.82rem;
    letter-spacing: 0.08em; text-transform: uppercase; padding: 15px 26px; border-radius: 999px;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .submit-btn:hover{ background: var(--accent); }
  .submit-btn:active{ transform: scale(0.98); }
  .form-note{ font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-faint); margin-top: 14px; line-height: 1.6; }
  .success-panel{
    border: 1px solid var(--accent-dim); background: var(--accent-soft); border-radius: 10px;
    padding: 26px; margin-top: 4px;
  }
  .success-panel h3{ font-family: var(--font-display); font-size: 1.3rem; margin-bottom: 8px; }
  .success-panel p{ color: var(--ink-dim); font-size: 0.9rem; line-height: 1.6; }
  .success-panel button{ margin-top: 16px; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); border-bottom: 1px solid var(--accent-dim); padding-bottom: 3px; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 900px){
    .about-grid, .two-col, .detail-grid, .contact-grid{ grid-template-columns: 1fr; }
    .feat-body, .proj-layout{ grid-template-columns: 1fr; }
    .feat-body .mockup, .proj-layout .mockup{ order: -1; }
    .hero-portrait-slot{ float: none; margin: 20px auto 0; width: min(70vw, 320px); height: min(88vw, 400px); }
    .hero-name-row{ display:block; }
    .cta-title{ font-size: clamp(2.6rem, 15vw, 5rem); }
  }

  @media (max-width: 640px){
    .nav-inner{ padding: 16px var(--edge); }
    .nav-links{ gap: 14px; }
    .foot-inner{ flex-direction: column; align-items: flex-start; }
    .cta-row{ flex-direction: column; align-items: flex-start; }
    .hero-portrait-slot{ width: min(78vw, 280px); height: min(96vw, 350px); }
  }
</style>

<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ============ DATA ============ */

  var PROFILE = {
    firstName: "Renzo",
    fullName: "Renzo Malik",
    roles: "Student / Developer / Writer",
    location: "India",
    year: "2026",
    email: "hello@renzomalik.dev",
    tagline: "I'm interested in understanding <span class=\"u\">how things work</span> — and then building my own version.",
    aboutSnapshotParagraph: "I'm a second-year CS student who spends more time outside the syllabus than in it. Most weeks I'm somewhere between shipping a small tool, reading a paper I don't fully understand yet, and rewriting the same three paragraphs of a blog post nobody's asked for. I like software that respects the person using it, and I'm trying to build things that do.",
    currently: {
      building: "a note-taking tool for research",
      learning: "how LLM agents plan and use tools",
      writing: "a series on local-first software",
      exploring: "generative UI and small AI-native apps"
    },
    aboutIntro: "I grew up taking things apart to see how they worked, which turned out to be a bad habit for keeping toys intact and a good one for becoming a developer.",
    aboutBackground: "I'm currently studying computer science, but most of what I actually use day to day I picked up outside a classroom — from documentation, other people's codebases, and a lot of trial and error at 1am. I started with small scripts to automate boring parts of schoolwork, then kept going because building things turned out to be the most satisfying way I'd found to think.",

  /* ============ PROJECTS ============ */

  function renderProjectEntry(p){
    return (
      '<article class="proj-entry">' +
        '<div class="wrap">' +
          '<div class="proj-top">' +
            '<span class="proj-num">' + p.num + ' / 0' + PROJECTS.length + '</span>' +
            '<span class="proj-status">' + p.status + '</span>' +
          '</div>' +
          '<h2 class="proj-name">' + p.name + '</h2>' +
          '<div class="proj-layout">' +
            '<div>' +
              '<p class="proj-desc">' + p.description + '</p>' +
              '<div class="proj-tags">' + p.tech.map(function(t){ return '<span class="proj-tag">' + t + '</span>'; }).join("") + '</div>' +
              '<div class="proj-meta-row">' +
                '<div><strong>Category</strong>' + p.category + '</div>' +
                '<div><strong>Year</strong>' + p.year + '</div>' +
                '<div><strong>Role</strong>' + p.role + '</div>' +
              '</div>' +
              '<div class="proj-actions">' +
                '<a class="btn-line" href="#/projects/' + p.slug + '">EXPLORE PROJECT &rarr;</a>' +
                '<a class="btn-line" href="' + SOCIALS[1].href + '">VIEW ON GITHUB &rarr;</a>' +
              '</div>' +
            '</div>' +
            '<a class="mockup-link" href="#/projects/' + p.slug + '" aria-label="Open ' + p.name + ' project details">' +
              '<div class="mockup">' + mockupFor(p.mockup) + '</div>' +
            '</a>' +
          '</div>' +
        '</div>' +
      '</article>'
    );
  }

  function renderProjectsPage(){
    return (
      '<section class="page-head"><div class="wrap">' +
        '<p class="eyebrow">SELECTED WORK</p>' +
        '<h1 class="page-title">PROJECTS.</h1>' +
        '<p class="page-sub">A few of the things I\'ve built recently — mostly small tools built to solve a problem I actually had.</p>' +
      '</div></section>' +
      PROJECTS.map(renderProjectEntry).join("")
    );
  }

  /* ============ PROJECT DETAIL ============ */

  function renderProjectDetail(p){
    var idx = PROJECTS.indexOf(p);
    var next = PROJECTS[(idx + 1) % PROJECTS.length];
    return (
      '<section class="page-head"><div class="wrap">' +
        '<a class="detail-back" href="#/projects">&larr; ALL PROJECTS</a>' +
        '<div class="detail-grid">' +
          '<div class="detail-info">' +
            '<p class="eyebrow" style="margin-top:24px">' + p.num + ' &mdash; ' + p.category.toUpperCase() + '</p>' +
            '<h1 class="page-title" style="margin-top:10px">' + p.name + '</h1>' +
            '<p class="proj-desc" style="margin-top:20px; max-width:52ch;">' + p.longDescription + '</p>' +
            '<dl>' +
              '<dt>Year</dt><dd>' + p.year + '</dd>' +
              '<dt>Status</dt><dd>' + p.status + '</dd>' +
              '<dt>Role</dt><dd>' + p.role + '</dd>' +
              '<dt>Stack</dt><dd>' + p.tech.join(", ") + '</dd>' +
            '</dl>' +
            '<div class="proj-actions">' +
              '<a class="btn-line" href="' + SOCIALS[1].href + '">VIEW ON GITHUB &rarr;</a>' +
              '<a class="btn-line" href="#/projects/' + next.slug + '">NEXT PROJECT &rarr;</a>' +
            '</div>' +
          '</div>' +
          '<div class="mockup">' + mockupFor(p.mockup) + '</div>' +
        '</div>' +
      '</div></section>'
    );
  }

  function renderNotFound(){
    return (
      '<section class="page-head"><div class="wrap">' +
        '<p class="eyebrow">404</p>' +
        '<h1 class="page-title">NOT FOUND.</h1>' +
        '<p class="page-sub">That page doesn\'t exist. <a class="explore-link" href="#/" style="margin-top:20px">BACK HOME &rarr;</a></p>' +
      '</div></section>'
    );
  }

  /* ============ ABOUT ============ */

  function renderAbout(){
    return (
      '<section class="page-head"><div class="wrap">' +
        '<p class="eyebrow">ABOUT ME</p>' +
        '<h1 class="page-title">WHO\'S<br>BEHIND THIS.</h1>' +
        '<p class="about-lede" style="margin-top:28px">' + PROFILE.aboutIntro + '</p>' +
      '</div></section>' +

      '<section class="section"><div class="wrap two-col">' +
        '<div><h2 class="stack-title">Background</h2><p class="prose">' + PROFILE.aboutBackground + '</p></div>' +
        '<div><h2 class="stack-title">What I care about</h2>' +
          '<p class="prose">' + PROFILE.aboutInterestsTech + '</p>' +
          '<p class="prose">' + PROFILE.aboutInterestsCreative + '</p>' +
        '</div>' +
      '</div></section>' +

      '<section class="section"><div class="wrap">' +
        '<p class="eyebrow" style="margin-bottom:20px">PHILOSOPHY</p>' +
        '<blockquote class="quote-block">' + PROFILE.philosophy + '</blockquote>' +
      '</div></section>' +

      '<section class="section"><div class="wrap">' +
        '<p class="eyebrow" style="margin-bottom:24px">SKILLS &amp; TOOLS</p>' +
        '<div class="skill-groups">' +
          '<div><p class="skill-group-label">Languages</p><div class="skill-tags">' +
            ["Python","TypeScript","JavaScript","SQL","HTML/CSS"].map(function(s){return '<span class="skill-tag">'+s+'</span>';}).join("") +
          '</div></div>' +
          '<div><p class="skill-group-label">Frameworks &amp; Tools</p><div class="skill-tags">' +
            ["React","Django","Next.js","Tailwind CSS","PostgreSQL","Git"].map(function(s){return '<span class="skill-tag">'+s+'</span>';}).join("") +
          '</div></div>' +
          '<div><p class="skill-group-label">Currently learning</p><div class="skill-tags">' +
            ["LLM agent design","Rust basics","Typography systems"].map(function(s){return '<span class="skill-tag">'+s+'</span>';}).join("") +
          '</div></div>' +
        '</div>' +
      '</div></section>' +

      '<section class="section"><div class="wrap">' +
        '<p class="eyebrow" style="margin-bottom:20px">WHERE THIS IS GOING</p>' +
        '<p class="prose" style="max-width:56ch; font-size:1.1rem;">' + PROFILE.currentDirection + '</p>' +
        '<a class="explore-link more-link" href="#/contact">GET IN TOUCH <span class="arrow">&rarr;</span></a>' +
      '</div></section>'
    );
  }

  /* ============ CONTACT ============ */

  function renderContact(){
    return (
      '<section class="page-head"><div class="wrap">' +
        '<p class="eyebrow">CONTACT</p>' +
        '<h1 class="page-title">LET\'S TALK.</h1>' +
        '<p class="page-sub">Whether it\'s a project, a question, or just something worth discussing — I read everything that comes in.</p>' +
      '</div></section>' +

      '<section class="section"><div class="wrap contact-grid">' +
        '<div>' +
          '<ul class="contact-list">' +
            SOCIALS.map(function(s){
              return '<li class="contact-row"><a href="' + s.href + '" style="display:flex; justify-content:space-between; width:100%; align-items:center;">' +
                '<span class="contact-row-label">' + s.label + '</span><span class="contact-row-value">' + s.value + '</span></a></li>';
            }).join("") +
          '</ul>' +
        '</div>' +
        '<div id="contact-form-holder">' + renderContactForm() + '</div>' +
      '</div></section>'
    );
  }

  function renderContactForm(){
    return (
      '<form id="contact-form" novalidate>' +
        '<div class="field">' +
          '<label for="cf-name">Name</label>' +
          '<input id="cf-name" name="name" type="text" autocomplete="name" aria-describedby="cf-name-err" />' +
          '<div class="field-error" id="cf-name-err"></div>' +
        '</div>' +
        '<div class="field">' +
          '<label for="cf-email">Email</label>' +
          '<input id="cf-email" name="email" type="email" autocomplete="email" aria-describedby="cf-email-err" />' +
          '<div class="field-error" id="cf-email-err"></div>' +
        '</div>' +
        '<div class="field">' +
          '<label for="cf-message">Message</label>' +
          '<textarea id="cf-message" name="message" aria-describedby="cf-message-err"></textarea>' +
          '<div class="field-error" id="cf-message-err"></div>' +
        '</div>' +
        '<button class="submit-btn" type="submit">Send message &rarr;</button>' +
        '<p class="form-note">This is a frontend prototype — messages aren\'t sent to a server. Submitting will show a demo confirmation only.</p>' +
      '</form>'
    );
  }

  function renderSuccessPanel(name){
    return (
      '<div class="success-panel">' +
        '<h3>Thanks, ' + escapeHtml(name) + '.</h3>' +
        '<p>This is a prototype, so nothing was actually sent — but in the real site, your message would land straight in my inbox. I\'d get back to you within a day or two.</p>' +
        '<button type="button" id="cf-reset">Send another message</button>' +
      '</div>'
    );
  }

  function wireContactForm(){
    var holder = document.getElementById("contact-form-holder");
    if (!holder) return;
    holder.addEventListener("submit", function(e){
      if (e.target && e.target.id === "contact-form"){
        e.preventDefault();
        var form = e.target;
        var name = form.querySelector("#cf-name");
        var email = form.querySelector("#cf-email");
        var message = form.querySelector("#cf-message");
        var valid = true;

        function setError(input, errId, msg){
          var errEl = document.getElementById(errId);
          if (msg){
            input.setAttribute("aria-invalid", "true");
            errEl.textContent = msg;
            valid = false;
          } else {
            input.removeAttribute("aria-invalid");
            errEl.textContent = "";
          }
        }

        setError(name, "cf-name-err", name.value.trim() ? "" : "Please enter your name.");
        var emailVal = email.value.trim();
        var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal);
        setError(email, "cf-email-err", !emailVal ? "Please enter your email." : (!emailOk ? "That email doesn't look right." : ""));
        setError(message, "cf-message-err", message.value.trim() ? "" : "Say a little about what's on your mind.");

        if (valid){
          holder.innerHTML = renderSuccessPanel(name.value.trim());
        }
      }
    });
    holder.addEventListener("click", function(e){
      if (e.target && e.target.id === "cf-reset"){
        holder.innerHTML = renderContactForm();
      }
    });
  }

  /* ============ ROUTER ============ */

  function render(){
    var path = parseHash();
    var app = document.getElementById("app");
    var html, title;

    if (path === ""){
      html = renderHome();
      title = "Renzo Malik — Builder, Writer, Explorer";
    } else if (path === "projects"){
      html = renderProjectsPage();
      title = "Projects — Renzo Malik";
    } else if (path.indexOf("projects/") === 0){
      var slug = path.split("/")[1];
      var proj = projectBySlug(slug);
      if (proj){ html = renderProjectDetail(proj); title = proj.name + " — Renzo Malik"; }
      else { html = renderNotFound(); title = "Not found — Renzo Malik"; }
    } else if (path === "about"){
      html = renderAbout();
      title = "About — Renzo Malik";
    } else if (path === "contact"){
      html = renderContact();
      title = "Contact — Renzo Malik";
    } else {
      html = renderNotFound();
      title = "Not found — Renzo Malik";
    }

    app.innerHTML = renderNav(path) + '<main id="main">' + html + '</main>' + renderFooter();
    document.title = title;
    window.scrollTo(0, 0);
    wireContactForm();
  }

  window.addEventListener("hashchange", render);
  if (!window.location.hash) window.location.hash = "#/";
  render();
})();
</script>
