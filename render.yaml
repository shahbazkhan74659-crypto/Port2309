services:
  - type: web
    name: portfolio
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Fill in via the Render dashboard after the first deploy gives you the *.onrender.com hostname
      # (or immediately if you already know it / are attaching a custom domain).
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      # Neon PostgreSQL connection string (Phase 10) — paste the existing Neon project's URL.
      - key: DATABASE_URL
        sync: false
      # Cloudflare R2 media storage — required for uploaded media (Resume PDF, ProjectImage
      # screenshots) to survive redeploys, since Render's free tier has no persistent disk.
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_PUBLIC_DOMAIN
        sync: false
